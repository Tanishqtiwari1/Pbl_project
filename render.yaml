services:
  - type: web
    name: cardioguard-api
    runtime: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: PYTHONPATH=Backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardioguard-db
          property: connectionString
      - key: CARDIOGUARD_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tanishqtiwari1.github.io

databases:
  - name: cardioguard-db
    databaseName: cardioguard
    user: cardioguard