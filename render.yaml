services:
  - type: web
    name: cardioguard-api
    runtime: python
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: PYTHONPATH=Backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///Backend/cardioguard.db
      - key: CARDIOGUARD_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tanishqtiwari1.github.io
      - key: FRONTEND_URL
        value: https://tanishqtiwari1.github.io/Pbl_project/
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false